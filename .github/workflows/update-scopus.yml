name: Update Scopus data

on:
  schedule:
    - cron: '0 */12 * * *'  # every 12 hours
  workflow_dispatch: {}      # allows manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Scopus data
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
        run: node fetch-scopus.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scopus-data.json
          git diff --quiet --cached || git commit -m "Update Scopus data"
          git push
