<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scopus Profile</title>
<style>
  body {
    margin: 0;
    padding: 16px;
    font-family: Arial, Helvetica, sans-serif;
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
  }
  .metrics {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .card {
    flex: 1;
    min-width: 110px;
    background: #f7f9fb;
    border: 1px solid #e1e6ea;
    border-radius: 8px;
    padding: 12px 16px;
    text-align: center;
  }
  .card .value {
    font-size: 24px;
    font-weight: 700;
    color: #1a2b3c;
  }
  .card .label {
    font-size: 12px;
    color: #5b6b7c;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  thead th {
    text-align: left;
    color: #5b6b7c;
    font-size: 12px;
    text-transform: uppercase;
    padding: 6px;
  }
  thead th.num {
    text-align: right;
  }
  tbody tr {
    border-bottom: 1px solid #e9edf1;
  }
  tbody td {
    padding: 8px 6px;
    vertical-align: top;
  }
  td.cites {
    text-align: right;
    color: #33475b;
    white-space: nowrap;
  }
  a.title {
    color: #1a5fb4;
    text-decoration: none;
    font-weight: 600;
  }
  .venue {
    font-size: 12px;
    color: #5b6b7c;
  }
  .license {
    font-size: 11px;
    color: #8a97a3;
    max-width: 900px;
    margin: 20px auto 0;
    border-top: 1px solid #e9edf1;
    padding-top: 10px;
  }
  .error {
    color: #b00;
  }
</style>
</head>
<body>
<div class="wrap" id="app">Loading&hellip;</div>

<script>
function escapeHtml(str) {
  var s = String(str);
  s = s.split('&').join('&amp;');
  s = s.split('<').join('&lt;');
  s = s.split('>').join('&gt;');
  s = s.split('"').join('&quot;');
  return s;
}

function metricCard(label, value) {
  var html = '';
  html += '<div class="card">';
  html += '<div class="value">' + escapeHtml(value) + '</div>';
  html += '<div class="label">' + escapeHtml(label) + '</div>';
  html += '</div>';
  return html;
}

function renderSummary(s) {
  var html = '<div class="metrics">';
  html += metricCard('h-index', s.hIndex);
  html += metricCard('Citations', s.citationCount);
  html += metricCard('Documents', s.documentCount);
  html += '</div>';
  return html;
}

function renderPublicationRow(p) {
  var year = '';
  if (p.date) {
    year = p.date.slice(0, 4);
  }
  var href = '#';
  if (p.doi) {
    href = 'https://doi.org/' + p.doi;
  }
  var row = '';
  row += '<tr>';
  row += '<td>';
  row += '<a class="title" href="' + escapeHtml(href) + '" target="_blank">';
  row += escapeHtml(p.title);
  row += '</a>';
  row += '<div class="venue">';
  row += escapeHtml(p.venue);
  if (year) {
    row += ' &middot; ' + year;
  }
  row += '</div>';
  row += '</td>';
  row += '<td class="cites">' + escapeHtml(p.citedBy) + ' cites</td>';
  row += '</tr>';
  return row;
}

function renderPublications(pubs) {
  if (!pubs.length) {
    return '<p>No publications found.</p>';
  }
  var rows = '';
  for (var i = 0; i < pubs.length; i++) {
    rows += renderPublicationRow(pubs[i]);
  }
  var html = '';
  html += '<table>';
  html += '<thead><tr>';
  html += '<th>Publication</th>';
  html += '<th class="num">Citations</th>';
  html += '</tr></thead>';
  html += '<tbody>' + rows + '</tbody>';
  html += '</table>';
  return html;
}

function showError(message) {
  var app = document.getElementById('app');
  app.innerHTML = '<p class="error">Could not load Scopus data right now: ' + escapeHtml(message) + '</p>';
}

function showData(data) {
  var app = document.getElementById('app');
  var html = '';
  html += renderSummary(data.summary);
  html += renderPublications(data.publications);
  html += '<p class="license">' + escapeHtml(data.license || '') + '</p>';
  app.innerHTML = html;
}

fetch('scopus-data.json?t=' + Date.now())
  .then(function (r) {
    if (!r.ok) {
      throw new Error('Data fetch returned ' + r.status);
    }
    return r.json();
  })
  .then(showData)
  .catch(function (err) {
    showError(err.message);
  });
</script>
</body>
</html>
